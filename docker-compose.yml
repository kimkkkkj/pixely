# MySQL 8 개발용 컨테이너
# 실행: docker compose --env-file .env up -d
# 로컬 MySQL 이 3306 을 점유하고 있으므로 기본 호스트 포트는 3307 (.env 의 MYSQL_PORT)
services:
  mysql:
    image: mysql:8.0
    container_name: pixely-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pixely}
      MYSQL_USER: ${MYSQL_USER:-pixely}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - pixely-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pixely-mysql-data:
