spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  application:
    name: pixely
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/pixely;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never

pixely:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  admin:
    email: ${ADMIN_EMAIL:admin@pixely.com}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5174}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  seed:
    legacy-images-dir: ${LEGACY_IMAGES_DIR:../_legacy/service-images}
  ai:
    provider: ${AI_PROVIDER:mock}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    rate-limit-per-minute: ${GENERATION_RATE_LIMIT_PER_MINUTE:5}
    mock:
      delay-min-ms: ${MOCK_DELAY_MIN_MS:2000}
      delay-max-ms: ${MOCK_DELAY_MAX_MS:4000}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    fastapi:
      url: ${FASTAPI_URL:http://localhost:8000}

logging:
  level:
    com.pixely: INFO
