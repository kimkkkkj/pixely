spring:
  datasource:
    url: jdbc:h2:mem:pixely-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

pixely:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-0123456789
    expiration-minutes: 60
  admin:
    email: admin@pixely.com
    password: admin-test-pass
  cors:
    allowed-origins: http://localhost:5174
  storage:
    upload-dir: ./build/test-uploads
  ai:
    provider: mock
    timeout-seconds: 10
    rate-limit-per-minute: 5
    mock:
      delay-min-ms: 0
      delay-max-ms: 50
